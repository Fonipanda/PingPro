version: "3.8"

services:
  backend:
    build: ./backend
    container_name: pingpro-backend
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
      - compilations:/app/compilations
    environment:
      - CORS_ORIGINS=*
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: http://localhost:8000
    container_name: pingpro-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads:
  compilations:
