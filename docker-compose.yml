version: '3.8'

services:
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: pingpro-anythingllm
    ports:
      - "3001:3001"
    volumes:
      - anythingllm_data:/app/server/storage
      - anythingllm_models:/app/server/storage/models
    environment:
      - STORAGE_DIR=/app/server/storage
      - SERVER_PORT=3001
      # Désactiver l'authentification
      - DISABLE_AUTH=true              # ✅ Changer à true
      # NE PAS définir AUTH_TOKEN quand DISABLE_AUTH=true
      - LLM_PROVIDER=anythingllm
      - DISABLE_TELEMETRY=true
      - ENABLE_LOCAL_MODELS=true
      # ❌ Désactiver Ollama / LocalAI
      - OLLAMA_BASE_URL=
      - LOCAL_AI_BASE_URL=
      - LOCAL_AI_ENABLED=false
      # Optionnel mais propre
      - DISABLE_TELEMETRY=true
    restart: unless-stopped
    networks:
      - pingpro_network

  mongodb:
    image: mongo:latest
    container_name: pingpro-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=pingpro
    restart: unless-stopped
    networks:
      - pingpro_network

volumes:
  anythingllm_data:
  anythingllm_models:
  mongodb_data:

networks:
  pingpro_network:
    driver: bridge